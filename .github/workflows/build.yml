name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- tests
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The runtime dependencies (pywebview and psutil) live in
          # pyproject.toml.  They have to be installed as well, or the
          # bundle is built without the window.
          pip install .

      - name: Lint (ruff)
        run: ruff check .

      # The interface has its own script, which runs the real code out
      # of app.js in a node sandbox.  The GitHub runner has node
      # already, so this costs nothing.
      - name: Interface checks (node)
        run: node scripts/check-gui-js.mjs

      - name: Unit tests
        run: pytest -q

      # A tag that does not match the version in the code publishes an
      # executable that calls itself something else.  The check runs on
      # every push, so the mistake is caught before the tag is made.
      - name: The version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/winsleep/version.py').read_text()).group(1))")
          PACKAGE_VERSION=$(python -c "import re,pathlib;print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::the tag says $TAG_VERSION but the program says $CODE_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::the tag says $TAG_VERSION but pyproject.toml says $PACKAGE_VERSION"
            exit 1
          fi
          echo "the tag, the program and the package all say $TAG_VERSION"

      # A green test suite means nothing if the tests would still be
      # green with the behaviour broken.  Every important piece of
      # logic is broken on purpose and the tests have to notice.
      - name: Mutation tests
        run: python scripts/mutation_test.py

  # -------------------------------------------------------------- windows
  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The runtime dependencies (pywebview and psutil) live in
          # pyproject.toml.  They have to be installed as well, or the
          # bundle is built without the window.
          pip install .

      # The core is checked on Linux above.  What is left are the
      # tests that need a real Windows machine: they call powercfg and
      # the Win32 API, and they look at the permissions of a file the
      # way Windows really records them.
      #
      # The whole suite runs here, not only the ones marked "windows".
      # A test that skips itself when it is not on Windows is silently
      # doing nothing on the Linux runner, so those tests were never
      # actually run by anything.  The default in pyproject.toml
      # excludes the marked ones, so the setting is overridden here.
      - name: Tests on Windows
        run: pytest -q -p no:cacheprovider --override-ini="addopts=-q --strict-markers"

      - name: Build the executable
        run: pyinstaller --clean --noconfirm main.spec

      # The signing certificate lives in the repository secrets as a
      # base64 PKCS#12 file.  The private key is never in the repository
      # and never in the artifact.
      - name: Sign the executable
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Host "no signing certificate in the secrets; the build is not signed"
            exit 0
          }
          # The certificate is issued by a private CA, so the runner has
          # to trust its root before the signature can be verified.
          Import-Certificate -FilePath "certificates\ServBay-User-CA-ECC-Root.crt" `
            -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          # signtool ships with the Windows SDK.  It is normally on the
          # PATH of the runner, but it is looked for explicitly so a
          # runner image without it fails with a clear message.
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "x64" } |
              Select-Object -First 1).FullName
          }
          if (-not $signtool) { Write-Error "signtool.exe was not found"; exit 1 }
          Write-Host "using $signtool"
          & $signtool sign /f $pfx /p $env:CERT_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist\DeepSleepForWindows.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
          # The certificate is not part of the build; delete it again.
          Remove-Item $pfx -Force
          & $signtool verify /pa /v "dist\DeepSleepForWindows.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "the signature does not verify"; exit 1 }

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "dist\DeepSleepForWindows.exe"
          if (-not (Test-Path $exe)) { Write-Error "the executable was not produced"; exit 1 }
          # The .exe is a GUI-subsystem binary: it has no console of its
          # own, so PowerShell neither waits for it nor catches its
          # output with &.  Start-Process with a redirected output
          # file waits for it and gives the output back.
          $out = Join-Path $env:RUNNER_TEMP "version.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "--version" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = (Get-Content $out -Raw)
          Write-Host $text
          if ($proc.ExitCode -ne 0) { Write-Error "the executable exited with $($proc.ExitCode)"; exit 1 }
          if ($text -notmatch 'DeepSleep For Windows') { Write-Error "the executable did not run"; exit 1 }

      - name: Smoke test the command line
        shell: pwsh
        run: |
          $exe = "dist\DeepSleepForWindows.exe"
          $out = Join-Path $env:RUNNER_TEMP "plans.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "plans" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $text = (Get-Content $out -Raw)
          Write-Host $text
          if ($proc.ExitCode -ne 0) { Write-Error "the executable exited with $($proc.ExitCode)"; exit 1 }
          if ($text -notmatch '[0-9a-fA-F]{8}-') { Write-Error "the power plans were not listed"; exit 1 }

      # A frozen build can be missing a module without noticing until
      # the window is opened.  The bundle is asked whether it has
      # everything, before the release is made.
      - name: Check that the bundle is complete
        shell: pwsh
        run: |
          $exe = "dist\DeepSleepForWindows.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList "selftest" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "selftest_err.txt")
          Get-Content $out -Raw | Write-Host
          Get-Content (Join-Path $env:RUNNER_TEMP "selftest_err.txt") -Raw | Write-Host
          if ($proc.ExitCode -ne 0) { Write-Error "the bundle is missing something"; exit 1 }

      - name: Package (zip)
        shell: pwsh
        run: |
          $name = "DeepSleepForWindows-Windows-x64"
          # The build is one file, so the zip holds exactly one .exe.
          Compress-Archive -Path "dist\DeepSleepForWindows.exe" -DestinationPath "dist\$name.zip" -Force
          Get-ChildItem dist\*.zip | ForEach-Object {
            Write-Host "$($_.Name) -> $($_.Length) bytes"
            if ($_.Length -lt 5000000) { Write-Error "$($_.Name) looks truncated"; exit 1 }
          }
          # Nothing but the executable may end up in the zip.
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked"
          Expand-Archive -Path "dist\$name.zip" -DestinationPath $unpacked -Force
          $inside = @(Get-ChildItem $unpacked -Recurse -File)
          if ($inside.Count -ne 1) { Write-Error "the zip holds more than the executable"; exit 1 }
          Write-Host "the zip holds exactly one file: $($inside[0].Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: deepsleep-for-windows-x64
          path: |
            dist/DeepSleepForWindows-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------- release
  release:
    name: Publish the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deepsleep-for-windows-x64
          path: dist

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="release-notes.md"
          test -f "$NOTES" || { echo "::error::release-notes.md is missing"; exit 1; }
          # Every tag publishes as a prerelease.  A version the maintainer
          # has not tested by hand stays a prerelease on purpose.
          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes-file "$NOTES" \
            dist/DeepSleepForWindows-Windows-x64.zip
