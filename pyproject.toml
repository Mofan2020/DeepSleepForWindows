[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsleep-for-windows"
version = "0.5.8"
description = "DeepSleep For Windows: idle-aware power plans, keep-awake and server mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Skyc8266" }]
keywords = ["windows", "power", "sleep", "automation", "powercfg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Power (UPS)",
]

# The core (rules, config, daemon, agent) needs nothing beyond the
# standard library.  pywebview is only needed for the window, and
# psutil only makes the CPU reading more accurate - both are optional at
# runtime and the program degrades gracefully without them.
dependencies = [
    "pywebview>=5.0,<7.0",
    "psutil>=5.9",
    # The icon in the notification area.  pystray picks its backend at
    # runtime, so it is loaded by name and has to be in the bundle.
    "pystray>=0.19,<0.20",
    "Pillow>=10.0",
    # The Windows backend of pywebview and of pystray both talk to the
    # .NET runtime through this one.
    "pythonnet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<0.13",
    "pyinstaller>=6.0,<7.0",
]

[project.scripts]
deepsleep = "winsleep.cli:main"

[project.gui-scripts]
deepsleep-gui = "winsleep.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"winsleep.gui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests marked "windows" need a real Windows machine, so they are
# skipped by default and run explicitly on the Windows runner.
addopts = "-q --strict-markers -m 'not windows'"
markers = [
    "windows: needs a real Windows machine",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
# ``winreg`` and ``ctypes.WinDLL`` only exist on Windows, so a type
# checker running on Linux or macOS cannot see their members.  The
# platform checks inside the code are the real guard; the errors the
# checker reports here are noise.
reportAttributeAccessIssue = "none"
reportMissingImports = "none"
